name: Alarm

options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    # ── Change these two before building on your device ─────────────────────
    DEVELOPMENT_TEAM: ""                     # your Apple Developer Team ID
    APP_BUNDLE_ID: com.example.alarm         # must be unique to you
    # ────────────────────────────────────────────────────────────────────────
    APP_GROUP_ID: group.$(APP_BUNDLE_ID)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # Version: bump both for every release and add a matching entry to CHANGELOG.json
    # (Tests/run.sh fails if they don't match).
    MARKETING_VERSION: "1.37.1"
    CURRENT_PROJECT_VERSION: "88"
    # iPhone and iPad; the Mac app is the iPad build running on the Mac (Mac Catalyst), which
    # keeps AlarmKit alarms, widgets and Talk without a separate codebase.
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: YES
    # Same bundle ID on the Mac, so the App Group (shared alarms, to-dos, notes) matches.
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
    GENERATE_INFOPLIST_FILE: YES

targets:
  Alarm:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: CHANGELOG.json
        buildPhase: resources
    dependencies:
      - target: AlarmWidget
      # The Mac app's menu bar item: an AppKit plugin, only in the Mac (Catalyst) build.
      - target: AlarmieMenuBar
        platformFilter: macOS
        embed: true
        codeSign: true
        copy:
          destination: plugins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Alarm.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Alarm-Mac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Alarmie
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPad (and so the Mac) supports every orientation, for Split View and Stage Manager.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity

  AlarmWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/AlarmWidget.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Widget/AlarmWidget-Mac.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Alarmie Widgets
        SKIP_INSTALL: YES

  # The Mac app's menu bar item (next to the battery): Mac Catalyst can't use AppKit, so this
  # small AppKit bundle is embedded in the app's PlugIns folder and loaded at launch.
  AlarmieMenuBar:
    type: bundle
    platform: macOS
    sources:
      - path: MenuBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).menubar
        PRODUCT_NAME: AlarmieMenuBar
        INFOPLIST_KEY_NSPrincipalClass: AlarmieMenuBar
        SKIP_INSTALL: YES
