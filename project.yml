name: Alarm

options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    # ── Change these two before building on your device ─────────────────────
    DEVELOPMENT_TEAM: ""                     # your Apple Developer Team ID
    APP_BUNDLE_ID: com.example.alarm         # must be unique to you
    # ────────────────────────────────────────────────────────────────────────
    APP_GROUP_ID: group.$(APP_BUNDLE_ID)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # Version: bump both for every release and add a matching entry to CHANGELOG.json
    # (Tests/run.sh fails if they don't match).
    MARKETING_VERSION: "1.15.0"
    CURRENT_PROJECT_VERSION: "22"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES

targets:
  Alarm:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: CHANGELOG.json
        buildPhase: resources
    dependencies:
      - target: AlarmWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Alarm.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Alarmie
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

  AlarmWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/AlarmWidget.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Alarmie Widgets
        SKIP_INSTALL: YES
